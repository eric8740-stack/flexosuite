name: CI

# Deux verifications, et les deux sont requises sur `main` :
#   test  - le backend passe ses tests
#   build - le front passe son lint, ses tests, et sort en EXPORT STATIQUE
#
# Le second n'est pas un confort : si l'export casse, le package client ne peut
# plus etre assemble. Mieux vaut le voir ici que le jour de la livraison.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests backend
        working-directory: backend
        run: python -m pytest -q

      - name: Garde-fou de confidentialite
        run: python -m pytest tests -q

      - name: Une seule tete de migration
        working-directory: backend
        run: |
          # Deux tetes Alembic = une migration qui ne s'appliquera pas chez le
          # client, et personne ne le voit avant l'installation.
          heads=$(python -m alembic heads 2>/dev/null | grep -c "(head)" || true)
          if [ "$heads" -gt 1 ]; then
            echo "::error::$heads tetes Alembic — il n'en faut qu'une."
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, la version du poste de developpement. Pas 20 : `jsdom`
          # (l'environnement des tests Vitest) declare `^22.22.2 || ^24.15.0`
          # et echoue sur Node 20 par un `markAsUncloneable is not a function`
          # venu d'undici — un message qui ne dit rien du vrai probleme.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependances
        working-directory: frontend
        run: npm ci

      # Lint et tests AVANT le build, et dans le meme job : `build` est un
      # check REQUIS sur `main`. Un troisieme job ne le serait pas tant que la
      # protection de branche ne le reclame pas — il pourrait echouer sans rien
      # empecher. Ici, une regression de lint ou un test rouge bloque la PR.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests du front
        working-directory: frontend
        run: npm run test

      - name: Export statique
        working-directory: frontend
        env:
          NEXT_OUTPUT: export
          # NEXT_PUBLIC_API_URL n'est volontairement PAS defini : la base d'API
          # doit rester relative, comme dans le package client.
        run: npm run build

      - name: L'export a bien produit une page
        working-directory: frontend
        run: |
          test -f out/index.html || {
            echo "::error::out/index.html absent — l'export statique n'a rien produit."
            exit 1
          }

      - name: Aucune route API, aucun middleware, aucune server action
        working-directory: frontend
        run: |
          # Les trois choses qui cassent l'export statique, donc la livraison.
          # On les interdit ici plutot que de decouvrir la panne au packaging.
          faute=0
          if find src -name "route.ts" -o -name "route.tsx" | grep -q .; then
            echo "::error::une route API Next a ete ajoutee — incompatible avec l'export statique."
            faute=1
          fi
          if find src -name "middleware.ts" | grep -q .; then
            echo "::error::un middleware a ete ajoute — incompatible avec l'export statique."
            faute=1
          fi
          if grep -rl '"use server"' src 2>/dev/null | grep -q .; then
            echo "::error::une server action a ete ajoutee — incompatible avec l'export statique."
            faute=1
          fi
          exit $faute
